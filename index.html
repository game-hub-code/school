<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mount St. Patrick Academy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cursor-ring" id="cursorRing"></div>

  <header id="header">
    <div class="logo">
      <img src="images/logo.png" alt="logo">
      <span>Mount St. Patrick Academy</span>
    </div>
    <a href="working-hours.html" class="nav-cta" data-hover>Enquire Now</a>
  </header>

  <div class="globe-stage" id="globeStage">
    <canvas id="particles"></canvas>
    <div class="playground" id="playground"></div>
  </div>

  <div class="drag-cursor" id="dragCursor">
    <svg class="icon-move" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2l-3 3h2v4H7V7l-3 3 3 3v-2h4v4H9l3 3 3-3h-2v-4h4v2l3-3-3-3v2h-4V5h2z"/>
    </svg>
    <svg class="icon-point" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 14a8 8 0 0 1-8 8"/>
      <path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/>
      <path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/>
      <path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/>
      <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
    </svg>
  </div>

  <div class="card-modal-overlay" id="cardModalOverlay">
    <div class="card-modal">
      <button class="card-modal-close" id="cardModalClose">&#10005;</button>
      <span class="tag" id="modalTag"></span>
      <h2 id="modalTitle"></h2>
      <img id="modalImg" src="" alt="" style="display:none;">
      <p id="modalDesc"></p>
    </div>
  </div>

  <footer>
    &copy; 2026 Mount St. Patrick Academy. All rights reserved.
  </footer>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mount St. Patrick Academy</title>
<style>
  :root{
    --bg:#0b1220;
    --bg-2:#0f1830;
    --accent:#5e9eff;
    --accent-2:#8b7bff;
    --text:#f4f6fb;
    --muted:#a7b0c4;
    --card:#101a33;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
    cursor:none;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- custom cursor ---------- */
  .cursor-dot, .cursor-ring{
    position:fixed; top:0; left:0; pointer-events:none; z-index:9999;
    border-radius:50%; transform:translate(-50%,-50%);
  }
  
  .cursor-ring{
    width:36px; height:36px; border:1.5px solid rgba(94,158,255,.6);
    transition:width .2s ease,height .2s ease,transform .15s ease, border-color .2s ease;
  }
  .cursor-ring.hover{width:64px; height:64px; border-color:var(--accent-2); background:rgba(139,123,255,.08);}
  @media (hover:none){ .cursor-dot,.cursor-ring{display:none;} body{cursor:auto;} }

  /* ---------- nav ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5%; backdrop-filter:blur(10px);
    background:linear-gradient(to bottom, rgba(11,18,32,.85), transparent);
    transition:padding .3s ease, background .3s ease;
  }
  header.scrolled{ padding:12px 5%; background:rgba(11,18,32,.9); }
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.1rem; letter-spacing:.3px;}
  .logo img{height:36px;}
  nav ul{display:flex; gap:34px; list-style:none;}
  nav a{font-size:.92rem; color:var(--muted); position:relative; padding:4px 0;}
  nav a::after{
    content:''; position:absolute; left:0; bottom:-2px; height:1px; width:0;
    background:var(--accent); transition:width .3s ease;
  }
  nav a:hover{color:var(--text);}
  nav a:hover::after{width:100%;}
  .nav-cta{
    background:var(--accent); color:#08101f; padding:10px 22px; border-radius:999px;
    font-weight:600; font-size:.88rem; transition:transform .25s ease, box-shadow .25s ease;
  }
  .nav-cta:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(94,158,255,.35);}

  /* ---------- flat card playground ---------- */
  .globe-stage{
    position:relative; width:100vw; height:100vh;
    cursor:none; -webkit-user-select:none; user-select:none;
    background:var(--bg); overflow:hidden;
  }
  .playground{
    position:absolute; top:50%; left:50%; will-change:transform;
    transform:translate(-50%,-50%) scale(1);
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .playground.zoomed{
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .playground.panning{
    transition:none;
  }

  /* ---- Westbourne-style cards ---- */
  .pg-card{
    position:absolute; width:260px; height:320px; border-radius:4px; overflow:hidden;
    background:#0f1b3a;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 18px 40px rgba(0,0,0,.5);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:28px;
    box-sizing:border-box;
  }
  /* gold inset border on all cards — the Westbourne signature */
  .pg-card::before{
    content:''; position:absolute; inset:14px;
    border:1px solid rgba(191,155,80,.55); border-radius:2px;
    pointer-events:none; z-index:2;
    transition:border-color .35s ease;
  }
  .pg-card:hover{
    transform:translateY(-6px) scale(1.025);
    box-shadow:0 32px 64px rgba(0,0,0,.65); z-index:5;
  }
  .pg-card:hover::before{ border-color:rgba(191,155,80,.9); }
  /* image cards: image fills the card, dark overlay keeps text legible */
  .pg-card img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    background:#0a1226;
    filter:grayscale(1) brightness(.45); transition:transform .5s ease, filter .35s ease;
    z-index:0;
  }
  .pg-card:hover img{ transform:scale(1.06); filter:grayscale(.3) brightness(.55); }
  /* gradient scrim on image cards */
  .pg-card::after{
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(10,18,50,.45) 0%, rgba(10,18,50,.7) 100%);
  }
  /* tinted (no-image) cards get a richer navy gradient */
  .pg-card.tinted{
    background:linear-gradient(155deg, #0d1a3a 0%, #162040 100%);
  }
  .pg-card.tinted::after{ background:none; }

  /* card body: tag on top, title centred — exact Westbourne layout */
  .pg-body{
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .pg-tag{
    display:block; font-size:.65rem; letter-spacing:2px; text-transform:uppercase;
    color:rgba(255,255,255,.55); font-weight:600;
  }
  .pg-title{
    font-size:1.3rem; font-weight:700; line-height:1.35;
    font-family:Georgia,'Times New Roman',serif;
    color:#fff;
  }

  /* ---- Westbourne-style drag cursor: larger white circle, clean 4-way arrow ---- */
  .drag-cursor{
    position:fixed; top:0; left:0; width:54px; height:54px; border-radius:50%;
    background:rgba(255,255,255,.97); color:#0b1220;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:9998;
    transform:translate(-50%,-50%) scale(0);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 4px 18px rgba(0,0,0,.4);
  }
  .drag-cursor.active{ transform:translate(-50%,-50%) scale(1); }
  .drag-cursor.grabbing{ transform:translate(-50%,-50%) scale(.84); }
  .drag-cursor svg{ width:22px; height:22px; }

  /* ---------- card detail modal (opens on card click) ---------- */
  .card-modal-overlay{
    position:fixed; inset:0; z-index:9997; background:rgba(5,9,20,.7);
    display:flex; align-items:center; justify-content:center; padding:40px;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .card-modal-overlay.open{ opacity:1; pointer-events:auto; }
  .card-modal{
    background:#f3f5f9; color:#0b1220; max-width:640px; width:100%; max-height:82vh;
    overflow-y:auto; border-radius:18px; position:relative; padding:64px 48px 56px;
    text-align:center; transform:translateY(24px) scale(.97); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .card-modal-overlay.open .card-modal{ transform:translateY(0) scale(1); }
  .card-modal-close{
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    width:36px; height:36px; border-radius:50%; background:rgba(11,18,32,.08);
    display:flex; align-items:center; justify-content:center; cursor:pointer; border:none;
    font-size:1.1rem; color:#0b1220;
  }
  .card-modal-close:hover{ background:rgba(11,18,32,.16); }
  .card-modal .tag{ color:var(--accent); font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:.78rem; }
  .card-modal h2{ font-size:clamp(1.7rem,3.5vw,2.4rem); margin:14px 0 22px; font-weight:700; }
    .card-modal img{ width:100%; max-height:280px; object-fit:contain; background:#e9ebf1; border-radius:12px; margin-bottom:22px; }
  .card-modal p{ color:#3c465c; line-height:1.6; font-size:1rem; }

  footer{
    position:relative; z-index:20;
    padding:20px 5%; text-align:center; color:var(--muted); font-size:.85rem;
  }

  @media (max-width:900px){
    nav ul{display:none;}
    .card-modal{ padding:56px 24px 40px; }
  }
</style>

</head>
<body>

  
  <div class="cursor-ring" id="cursorRing"></div>

  <header id="header">
    <div class="logo">
      <img src="images/logo.png" alt="logo">
      <span>Mount St. Patrick Academy</span>
    </div>
    <a href="working-hours.html" class="nav-cta" data-hover>Enquire Now</a>
  </header>

  <div class="globe-stage" id="globeStage">
    <div class="playground" id="playground"></div>
  </div>

  <div class="drag-cursor" id="dragCursor">
    <!-- Westbourne-style 4-way move arrow -->
    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2l-3 3h2v4H7V7l-3 3 3 3v-2h4v4H9l3 3 3-3h-2v-4h4v2l3-3-3-3v2h-4V5h2z"/>
    </svg>
  </div>

  <div class="card-modal-overlay" id="cardModalOverlay">
    <div class="card-modal">
      <button class="card-modal-close" id="cardModalClose">&#10005;</button>
      <span class="tag" id="modalTag"></span>
      <h2 id="modalTitle"></h2>
      <img id="modalImg" src="" alt="" style="display:none;">
      <p id="modalDesc"></p>
    </div>
  </div>

  <footer>
    &copy; 2026 Mount St. Patrick Academy. All rights reserved.
  </footer>

<script>
  // ---- force scroll to top on load (avoid browser scroll-restoration offsetting the fixed stage) ----
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  // ---- custom cursor ----
  
  const ring = document.getElementById('cursorRing');
  let mx=0,my=0, rx=0, ry=0;
  window.addEventListener('mousemove', e=>{
    mx=e.clientX; my=e.clientY;
    
  });
  function animateRing(){
    rx += (mx-rx)*0.15;
    ry += (my-ry)*0.15;
    ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%,-50%)`;
    requestAnimationFrame(animateRing);
  }
  animateRing();
  document.querySelectorAll('[data-hover]').forEach(el=>{
    el.addEventListener('mouseenter', ()=>ring.classList.add('hover'));
    el.addEventListener('mouseleave', ()=>ring.classList.remove('hover'));
  });

  // ---- header shrink on scroll ----
  const header = document.getElementById('header');
  window.addEventListener('scroll', ()=>{
    header.classList.toggle('scrolled', window.scrollY > 40);
  });

  // ---- flat card playground: plain DOM/CSS, cards scattered on a pannable plane, drag to explore ----
  (function initPlayground(){
    const stage = document.getElementById('globeStage');
    const playground = document.getElementById('playground');
    const dragCursor = document.getElementById('dragCursor');

    // NOTE: order matters here — cards fill the grid left-to-right, top-to-bottom,
    // and the 3 featured cards are placed at flattened positions 8, 9, 10 (row 1,
    // cols 2-4 of the 6-col grid) so they land in the centre cell of the rectangle,
    // which is what's on screen by default when the page loads (pan starts at 0,0).
    const CARD_DATA = [
      {img:'images/Class-Rooms.jpg', tag:'Learning Spaces', title:'Modern Classrooms', desc:'Bright, tech-enabled rooms designed for collaborative and focused learning, built to support every stage of a student\u2019s growth.'},
      {img:'images/Computer-Lab.jpg', tag:'Technology', title:'Computer Labs', desc:'Hands-on digital literacy from coding basics to advanced applications, in fully equipped modern labs.'},
      {img:'images/Library.jpg', tag:'Resources', title:'Library & Research', desc:'A quiet, resource-rich space that fuels independent thinking and a lifelong love of reading.'},
      {img:'images/Investiture-Ceremony.jpg', tag:'Tradition', title:'Investiture Ceremony', desc:'Recognising student leaders who carry our values forward into every corner of school life.'},
      {tag:'School Life', title:'Co-curricular Programs', tinted:true, desc:'From debate to robotics to the arts, our co-curricular programs help students discover new passions.'},
      {img:'images/Sports-Facilities.jpg', tag:'Athletics', title:'Sports Facilities', desc:'Purpose-built courts and grounds supporting a full calendar of inter-house and inter-school competition.'},
      {img:'images/Inter-House-Dance.jpg', tag:'Culture', title:'Inter-House Dance', desc:'Where creativity and house spirit take centre stage in one of our most anticipated events of the year.'},
      {img:'images/Independance-Day.jpg', tag:'Community', title:'Red Day', desc:'Instilling pride and civic awareness from an early age through school-wide celebrations.'},
      {tag:'School Life', title:'What We Stand For', tinted:true, desc:'Curiosity, character and community sit at the heart of everything we do, guiding students to become confident, capable people.', featured:true},
      {img:'images/Bro.-rajesh.jpg', tag:'Leadership', title:'A Message from Leadership', desc:'Guided by a leadership team dedicated to nurturing every student\u2019s potential.', featured:true},
      {tag:'Admissions', title:'Start Your Journey', tinted:true, desc:'Enrolments for 2026\u201327 are now open. Book a campus tour and see Mount St. Patrick Academy for yourself.', featured:true},
      {img:'images/Red-Colour-Day.jpg', tag:'Traditions', title:'Yoga Day', desc:'A vibrant, school-wide celebration of house pride, colour and community spirit.'},
      {img:'images/Online-Portal.jpg', tag:'Parents', title:'Online Portal', desc:'Parents can track attendance, results and school updates in one convenient, secure portal.'},
      {img:'images/Other-Facilities.jpg', tag:'Campus', title:'Other Facilities', desc:'From the auditorium to the science wing, our campus is built to support every kind of learner.'},
      {tag:'School Life', title:'Senior School', tinted:true, desc:'Senior years focused on real-world readiness, university pathways and independent thinking.'},
      {img:'images/Online-Registration-Form.jpg', tag:'Admissions', title:'Registration', desc:'A simple, guided online registration process to help new families get started quickly.'},
      {img:'images/Online-Fee-Payment.jpg', tag:'Parents', title:'Fee Payment', desc:'Secure, convenient online fee payment with full statements and history available anytime.'},
      {img:'images/Slide1.jpg', tag:'Campus Life', title:'A Day at MSPA', desc:'A glimpse into the everyday rhythm of learning, activity and community on campus.'},
      {img:'images/Slide2.jpg', tag:'Campus Life', title:'Building Confidence', desc:'Every student is encouraged to speak up, take part and lead in their own way.'},
      {img:'images/Slide3.jpg', tag:'Campus Life', title:'Learning Together', desc:'Collaborative projects and peer learning are woven throughout our curriculum.'},
      {img:'images/Slide4.jpg', tag:'Campus Life', title:'Campus Spirit', desc:'Our community shows up for every match, performance and milestone.'},
      {tag:'Academics', title:'Programs Built Around Real Thinking', tinted:true, desc:'From early learning to senior years, every stage is designed to stretch curiosity and build confidence.'},
      {tag:'Facilities', title:'A Campus Built for Every Student', tinted:true, desc:'1200+ students, 60+ educators and 15 dedicated facilities, all on one purpose-built campus.'},
      {tag:'Visit Us', title:'Plan Your Visit', tinted:true, desc:'Schedule a campus tour and meet our faculty in person \u2014 we\u2019d love to show you around.'},
    ];

    const CARD_W = 260, CARD_H = 320;

    // ============================================
    // GAP — the ONLY variable you need to change.
    // This is the space (px) between any two
    // adjacent cards, on every side, uniformly.
    // ============================================
    const GAP = 250;

    // ---- perfect rectangle grid: cols x rows exactly fits every card, no holes ----
    const cols = 6;
    const rows = Math.ceil(CARD_DATA.length / cols); // 24 cards / 6 cols = 4 rows exactly

    const cellW = CARD_W + GAP, cellH = CARD_H + GAP;
    const gridW = cols * cellW - GAP;   // rectangle width (cards + inner gaps only)
    const gridH = rows * cellH - GAP;   // rectangle height

    // plane sized to the grid rectangle plus a margin so panning has room to breathe
    const PLANE_MARGIN = 260;
    const PLANE_W = gridW + PLANE_MARGIN*2;
    const PLANE_H = gridH + PLANE_MARGIN*2;
    playground.style.width = PLANE_W + 'px';
    playground.style.height = PLANE_H + 'px';

    const gridOriginX = (PLANE_W - gridW)/2;
    const gridOriginY = (PLANE_H - gridH)/2;

    // featured cards are slightly larger but stay put in their own grid cell —
    // in sync with the rectangle rather than floating outside it
    const FEATURED_SCALE = 1.12;

    CARD_DATA.forEach((data, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = gridOriginX + col*cellW;
      const y = gridOriginY + row*cellH;

      const card = document.createElement('div');
      card.className = 'pg-card' + (data.tinted ? ' tinted' : '');
      card.style.left = x + 'px';
      card.style.top = y + 'px';
      if(data.featured){
        card.style.zIndex = 8;
        card.style.transform = `scale(${FEATURED_SCALE})`;
      }
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', data.title);

      if(data.img){
        const img = document.createElement('img');
        img.src = data.img; img.alt = data.title; img.loading = 'lazy';
        card.appendChild(img);
      }
      const body = document.createElement('div');
      body.className = 'pg-body';
      body.innerHTML = `<span class="pg-tag">${data.tag}</span><span class="pg-title">${data.title}</span>`;
      card.appendChild(body);

      card.addEventListener('click', () => { if(!wasDragged) openCardModal(data); });
      playground.appendChild(card);
    });

    // ---- drag to pan the playground + inertia ----
    let isDown=false, lastX=0, lastY=0, velX=0, velY=0;
    let dragDist=0, wasDragged=false;
    let panX=-255, panY=285;
    const PAN_MARGIN = 260; // how far past the edge you can pan before clamping

    // ---- zoom-out while dragging ----
    const ZOOM_OUT_SCALE = 0.9;
    let zoomedOut = false;

    function applyPan(){
      const scale = zoomedOut ? ZOOM_OUT_SCALE : 1;
      const maxX = PLANE_W/2 - PAN_MARGIN, maxY = PLANE_H/2 - PAN_MARGIN;
      panX = Math.max(-maxX, Math.min(maxX, panX));
      panY = Math.max(-maxY, Math.min(maxY, panY));
      playground.style.transform = `translate(-50%,-50%) translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    function enterZoomOut(){
      if(zoomedOut) return;
      zoomedOut = true;
      playground.classList.add('zoomed');
      playground.classList.remove('panning');
      applyPan();
    }
    function exitZoomOut(){
      if(!zoomedOut) return;
      zoomedOut = false;
      playground.classList.add('zoomed');
      playground.classList.remove('panning');
      applyPan();
    }
    function onDown(x,y){
      isDown = true; lastX=x; lastY=y; velX=0; velY=0;
      dragDist=0; wasDragged=false;
      dragCursor.classList.add('grabbing');
      enterZoomOut();
    }
    function onMove(x,y){
      dragCursor.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%) scale(${isDown?0.88:1})`;
      if(!isDown) return;
      const dx = x-lastX, dy = y-lastY;
      dragDist += Math.abs(dx) + Math.abs(dy);
      if(dragDist > 6){
        wasDragged = true;
        playground.classList.add('panning');
      }
      panX += dx; panY += dy;
      applyPan();
      velX = dx; velY = dy;
      lastX=x; lastY=y;
    }
    function onUp(){
      isDown=false; dragCursor.classList.remove('grabbing');
      playground.classList.remove('panning');
      exitZoomOut();
    }

    stage.addEventListener('mouseenter', ()=>dragCursor.classList.add('active'));
    stage.addEventListener('mouseleave', ()=>{ dragCursor.classList.remove('active'); onUp(); });
    stage.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
    window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
    window.addEventListener('mouseup', onUp);
    stage.addEventListener('touchstart', e=>{
      const t=e.touches[0];
      onDown(t.clientX,t.clientY);
    }, {passive:true});
    stage.addEventListener('touchmove', e=>{const t=e.touches[0]; onMove(t.clientX,t.clientY);}, {passive:true});
    stage.addEventListener('touchend', onUp);

    // ---- click a card -> open floating detail modal ----
    const modalOverlay = document.getElementById('cardModalOverlay');
    const modalTag = document.getElementById('modalTag');
    const modalTitle = document.getElementById('modalTitle');
    const modalImg = document.getElementById('modalImg');
    const modalDesc = document.getElementById('modalDesc');

    function openCardModal(data){
      modalTag.textContent = data.tag || '';
      modalTitle.textContent = data.title || '';
      if(data.img){ modalImg.src = data.img; modalImg.style.display = 'block'; }
      else { modalImg.style.display = 'none'; }
      modalDesc.textContent = data.desc || '';
      modalOverlay.classList.add('open');
    }
    function closeCardModal(){ modalOverlay.classList.remove('open'); }
    document.getElementById('cardModalClose').addEventListener('click', closeCardModal);
    modalOverlay.addEventListener('click', e=>{ if(e.target === modalOverlay) closeCardModal(); });
    window.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCardModal(); });

    // ---- inertia loop ----
    function animate(){
      requestAnimationFrame(animate);
      if(!isDown && !zoomedOut && (Math.abs(velX) > 0.05 || Math.abs(velY) > 0.05)){
        velX *= 0.94; velY *= 0.94;
        panX += velX; panY += velY;
        applyPan();
      }
    }
    playground.classList.add('panning');
    applyPan();
    requestAnimationFrame(()=>playground.classList.remove('panning'));
    animate();
  })();

</script>
</body>
</html>
